<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essentials of Geology - Interactive Reader</title>
    <style>
        /* CSS Terpadu */
        :root {
            --primary: #2c3e50;
            --secondary: #18bc9c;
            --bg-light: #ecf0f1;
            --text-dark: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* Sidebar Navigasi */
        #sidebar {
            width: 300px;
            background-color: var(--primary);
            color: white;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        #sidebar h2 {
            text-align: center;
            padding: 20px;
            margin: 0;
            background-color: #1a252f;
            font-size: 1.2rem;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #bdc3c7;
            padding: 15px 20px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            transition: all 0.3s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--secondary);
            color: white;
            font-weight: bold;
        }

        /* Konten Utama */
        #main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background-color: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary);
            border-bottom: 3px solid var(--secondary);
            padding-bottom: 10px;
        }

        p {
            line-height: 1.8;
            font-size: 1.1rem;
            text-align: justify;
        }

        .citation {
            font-size: 0.85rem;
            color: #7f8c8d;
            vertical-align: super;
        }

        /* Responsif */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; flex: none; }
            #main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Daftar Isi<br><small>Essentials of Geology</small></h2>
        <div id="nav-container"></div>
    </div>

    <div id="main-content">
        <h1 id="chapter-title">Selamat Datang</h1>
        <div id="chapter-body">
            <p>Silakan pilih bab di menu samping untuk mulai membaca rangkuman dari buku <strong>Essentials of Geology</strong> yang diedit oleh Judith Rosales[cite: 5, 7].</p>
        </div>
    </div>

    <script>
        // Data Buku (Ditarik langsung dari referensi)
        const bookData = [
            {
                id: "ch1",
                title: "1. Introduction to Geology",
                content: "<p>Geologi secara harfiah berarti studi tentang Bumi, material pembentuknya, strukturnya, dan proses yang memengaruhinya[cite: 45]. Mayoritas data geologi berasal dari penelitian pada material padat Bumi, yang dibagi menjadi dua kategori: batuan dan material yang belum terkonsolidasi[cite: 48]. Bab ini juga mencakup skala waktu geologi yang mencakup sejarah Bumi sejak 4,567 Milyar tahun lalu (pembentukan Tata Surya) hingga saat ini di era Holosen[cite: 55].</p>"
            },
            {
                id: "ch2",
                title: "2. History of Geology",
                content: "<p>Sejarah geologi berkaitan dengan perkembangan ilmu alam geologi, mulai dari zaman kuno seperti karya Theophrastus ('Peri Lithon') hingga abad ke-20 dengan penemuan teori lempeng tektonik[cite: 87, 98]. William Smith (1769–1839) menggambar beberapa peta geologi pertama dan mulai mengurutkan strata batuan berdasarkan fosil di dalamnya[cite: 90]. Stratigrafi sangat penting dalam cabang ini, yaitu studi tentang lapisan batuan (strata) dan pelapisannya[cite: 113].</p>"
            },
            {
                id: "ch3",
                title: "3. Principles of Geology",
                content: "<p>Prinsip-prinsip utama dalam geologi meliputi Hubungan Potong-Memotong (Cross-Cutting Relationships), yaitu fitur geologi yang memotong fitur lain adalah yang lebih muda[cite: 142]. Selain itu, ada Hukum Superposisi yang menyatakan bahwa dalam urutan sedimen yang tidak terdeformasi, lapisan tertua berada di bagian paling bawah[cite: 159]. Prinsip Suksesi Fauna yang dinamai dari William Smith juga penting untuk menentukan usia relatif batuan dengan melihat urutan flora dan fauna fosil[cite: 160].</p>"
            },
            {
                id: "ch4",
                title: "4. Geologic Province",
                content: "<p>Provinsi geologi adalah entitas spasial dengan atribut geologi atau geomorfologi yang sama, seperti cekungan atau sabuk lipatan[cite: 164]. Kategori provinsi ini meliputi Shield (batuan beku kristalin Prakambrium), Platform (strata sedimen datar yang menutupi ruang bawah tanah), Orogen (formasi kerak benua yang terlipat dan terangkat), Basin (strata yang melengkung), dan Provinsi Batuan Beku Besar (akumulasi besar batuan vulkanik)[cite: 164].</p>"
            },
            {
                id: "ch5",
                title: "5. Plate Tectonics",
                content: "<p>Litosfer bumi terpecah menjadi beberapa lempeng tektonik yang bergerak melintasi astenosfer[cite: 211]. Terdapat tiga jenis batas lempeng utama: batas divergen (lempeng saling menjauh membentuk dasar samudra baru), batas konvergen (satu lempeng menunjam di bawah yang lain membentuk palung atau pegunungan), dan batas transform (lempeng bergesekan satu sama lain)[cite: 216, 217]. Tarikan lempeng (Slab-pull) dianggap sebagai gaya terbesar yang bekerja pada pergerakan lempeng[cite: 221].</p>"
            },
            {
                id: "ch6",
                title: "6. Structural Geology",
                content: "<p>Geologi struktur adalah studi tentang distribusi tiga dimensi unit batuan sehubungan dengan sejarah deformasinya[cite: 245]. Tujuan utamanya adalah mengukur geometri batuan saat ini untuk mengungkap informasi tentang tekanan yang menghasilkan deformasi tersebut[cite: 245]. Ilmu ini memiliki kepentingan utama dalam geologi ekonomi, karena lipatan dan patahan batuan umumnya membentuk perangkap yang mengakumulasi minyak bumi, gas alam, dan bijih mineral logam[cite: 246].</p>"
            },
            {
                id: "ch7",
                title: "7. Planetary Geology",
                content: "<p>Geologi planet berkaitan dengan geologi benda-benda langit seperti planet, bulan, asteroid, komet, dan meteorit[cite: 258]. Di tata surya kita, ada empat planet kebumian (terestrial) yang memiliki permukaan berbatu yang kompak: Merkurius, Venus, Bumi, dan Mars[cite: 258, 267]. Bab ini mengeksplorasi morfologi planet-planet tersebut, termasuk sabuk asteroid yang terletak antara orbit Mars dan Jupiter[cite: 287].</p>"
            },
            {
                id: "ch8",
                title: "8. Engineering Geology",
                content: "<p>Geologi teknik adalah penerapan ilmu geologi pada studi rekayasa untuk memastikan bahwa faktor-faktor geologi ditangani dengan baik dalam lokasi, desain, dan konstruksi pekerjaan teknik[cite: 311]. Ahli geologi teknik mengevaluasi bahaya seperti patahan sesar, tanah longsor, erosi, penurunan tanah, dan tanah yang lemah[cite: 313]. Ilmu ini terkait erat dengan mekanika tanah dan mekanika batuan untuk memprediksi perilaku material bumi[cite: 314].</p>"
            },
            {
                id: "ch9",
                title: "9. Economic Geology",
                content: "<p>Geologi ekonomi berkaitan dengan material bumi yang dapat digunakan untuk tujuan ekonomi atau industri, termasuk logam mulia, bahan bakar fosil (minyak bumi dan batu bara), batu konstruksi, dan air[cite: 330]. Tujuan utamanya adalah untuk memandu eksplorasi sumber daya mineral dan menentukan endapan mana yang layak secara ekonomi untuk ditambang[cite: 330, 331].</p>"
            }
        ];

        // Mendapatkan elemen DOM
        const navContainer = document.getElementById('nav-container');
        const chapterTitle = document.getElementById('chapter-title');
        const chapterBody = document.getElementById('chapter-body');

        // Fungsi untuk memperbarui konten utama
        function loadChapter(id) {
            const chapter = bookData.find(ch => ch.id === id);
            if(chapter) {
                chapterTitle.innerHTML = chapter.title;
                chapterBody.innerHTML = chapter.content;

                // Update styling tombol aktif
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.getElementById('btn-' + id).classList.add('active');
            }
        }

        // Generate menu navigasi secara dinamis
        function initApp() {
            bookData.forEach(chapter => {
                const button = document.createElement('button');
                button.className = 'nav-btn';
                button.id = 'btn-' + chapter.id;
                button.innerText = chapter.title;
                button.onclick = () => loadChapter(chapter.id);
                navContainer.appendChild(button);
            });
            
            // Muat bab pertama secara otomatis
            if(bookData.length > 0) {
                loadChapter(bookData[0].id);
            }
        }

        // Jalankan aplikasi saat halaman dimuat
        window.onload = initApp;

    </script>
</body>
</html>
